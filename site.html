<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech-Lab</title>
    <style>
        /* Genel stil */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #0d47a1;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2em;
        }

        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            padding: 60px 20px;
            text-align: center;
        }

        .card {
            display: inline-block;
            background: #fff;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            width: 200px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #1976d2;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        footer {
            background: #0d47a1;
            color: #fff;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>NovaTech-Lab</h1>
        <nav>
            <a href="#projects">Projeler</a>
            <a href="#music">Müzik</a>
            <a href="#contact">İletişim</a>
        </nav>
    </header>

    <section id="hero">
        <h2>Hoş geldiniz!</h2>
        <p>Projelerim ve müzik çalışmalarımı buradan inceleyebilirsiniz.</p>
        <button id="learnMore">Daha fazla bilgi</button>
    </section>

    <section id="projects">
        <h2>Projeler</h2>
        <div class="card">Proje 1</div>
        <div class="card">Proje 2</div>
        <div class="card">Proje 3</div>
    </section>

    <section id="music">
        <h2>Müzik</h2>
        <p>Yakında müzik projelerimi ekleyeceğim.</p>
    </section>

    <section id="contact">
        <h2>İletişim</h2>
        <p>Email: example@novatech-lab.com</p>
    </section>

    <footer>
        <p>&copy; 2026 NovaTech-Lab</p>
    </footer>

    <script>
        // Basit JS: "Daha fazla bilgi" butonuna tıklayınca projeler bölümüne git
        document.getElementById('learnMore').addEventListener('click', function() {
            document.getElementById('projects').scrollIntoView({behavior: "smooth"});
        });
    </script>

</body>
</html>
