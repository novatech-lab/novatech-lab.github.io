<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaTech V4 Pro Ultimate</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg: #030508;
            --card: #0c0f16;
            --border: #1e2532;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --accent: #10b981;
            --danger: #ef4444;
            --text: #f9fafb;
            --text-dim: #94a3b8;
            --xp: #fbce44;
            --nav-h: 65px;
            --sidebar-w: 260px;
        }

        body.light-mode {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.5;
            transition: background 0.3s ease;
        }

        /* Notifications */
        #notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
            min-width: 250px;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Auth Screen */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 5000;
            display: none; /* JS will show if not logged in */
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, var(--bg) 100%);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 6000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Main App Layout */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--card);
            border-right: 1px solid var(--border);
            position: fixed;
            top: var(--nav-h);
            bottom: 0;
            left: 0;
            z-index: 900;
            padding: 20px;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .main-content {
            margin-left: var(--sidebar-w);
            margin-top: var(--nav-h);
            padding: 24px;
            max-width: 1000px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        /* Elements */
        .btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: rgba(128,128,128,0.1); color: var(--text); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        input {
            width: 100%;
            background: rgba(128,128,128,0.05);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text);
            margin-bottom: 12px;
            outline: none;
        }

        .xp-bar { height: 10px; background: rgba(0,0,0,0.1); border-radius: 20px; overflow: hidden; margin-top: 10px; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); width: 0%; transition: 0.5s; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .nav-link:hover, .nav-link.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); z-index: 2000; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <!-- 1. Loading Screen (Initial) -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="color: var(--text-dim);">NovaTech Hazırlanıyor...</p>
    </div>

    <!-- 2. Single Auth Screen -->
    <div id="auth-screen">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
            <h1 class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 10px;">NOVA<span>TECH</span></h1>
            <p style="color: var(--text-dim); margin-bottom: 25px;">Geleceğin Eğitim Platformu</p>
            <input type="email" id="auth-email" placeholder="E-posta">
            <input type="password" id="auth-pass" placeholder="Şifre">
            <button class="btn btn-primary" style="width: 100%;" onclick="handleAuthAction()">Giriş Yap / Kayıt Ol</button>
            <p style="font-size: 0.7rem; color: var(--text-dim); margin-top: 15px;">Yeni kullanıcılar otomatik kayıt edilir.</p>
        </div>
    </div>

    <!-- 3. Main App UI -->
    <div id="app-root" style="display: none;">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn btn-secondary" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">NOVA<span>TECH</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="daily-btn" class="btn btn-secondary" onclick="claimDailyReward()">
                    <i class="fas fa-gift" style="color: var(--xp)"></i>
                </div>
                <img id="user-avatar" style="width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--border);">
            </div>
        </header>

        <aside class="sidebar" id="sidebar">
            <div class="card" style="padding: 15px; margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="side-avatar" style="width: 45px; height: 45px; border-radius: 50%;">
                    <div style="overflow: hidden;">
                        <div id="side-name" style="font-weight: 700; white-space: nowrap; text-overflow: ellipsis;">Yükleniyor...</div>
                        <div id="side-rank" style="font-size: 0.7rem; color: var(--primary); font-weight: 800;">ACEMİ</div>
                    </div>
                </div>
                <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
                <div id="xp-text" style="font-size: 0.65rem; margin-top: 5px; text-align: right; color: var(--text-dim);">0 / 1000 XP</div>
            </div>

            <nav>
                <div class="nav-link active" onclick="switchTab('forum')"><i class="fas fa-home"></i> Sosyal Akış</div>
                <div class="nav-link" onclick="switchTab('study')"><i class="fas fa-book"></i> Ders Çalış</div>
                <div class="nav-link" onclick="switchTab('ranks')"><i class="fas fa-trophy"></i> Sıralama</div>
                <div class="nav-link" onclick="switchTab('settings')"><i class="fas fa-cog"></i> Ayarlar</div>
            </nav>

            <button class="btn btn-danger" onclick="logout()" style="width: 100%; margin-top: 20px;">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </button>
        </aside>

        <main class="main-content">
            <!-- Forum Tab -->
            <section id="tab-forum" class="tab-pane">
                <div class="card">
                    <textarea id="post-text" placeholder="Bugün neler çalıştın?" style="width:100%; background:transparent; border:none; color:var(--text); outline:none; resize:none; font-size:1rem;" rows="3"></textarea>
                    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                        <button class="btn btn-primary" onclick="submitPost()">Paylaş (+10 XP)</button>
                    </div>
                </div>
                <div id="feed-container"></div>
            </section>

            <!-- Other tabs are managed by JS -->
            <section id="tab-study" class="tab-pane" style="display:none;">
                <div class="card">
                    <h3>Çalışma Girişi</h3>
                    <input type="text" id="lesson-name" placeholder="Ders Adı (Örn: Matematik)">
                    <input type="number" id="q-count" placeholder="Soru Sayısı">
                    <button class="btn btn-primary" style="width:100%" onclick="saveStudy()">Kaydet (+50 XP)</button>
                </div>
            </section>

            <section id="tab-ranks" class="tab-pane" style="display:none;">
                <div class="card" id="leaderboard-content">
                    <h3>Liderlik Tablosu</h3>
                </div>
            </section>

            <section id="tab-settings" class="tab-pane" style="display:none;">
                <div class="card">
                    <h3>Profil Ayarları</h3>
                    <input type="text" id="name-change" placeholder="Yeni İsim">
                    <button class="btn btn-primary" onclick="updateName()">Güncelle</button>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBGFyQsqe32hGgskY5yRfrbXlH8MuHKaLE",
            authDomain: "novatech-e7507.firebaseapp.com",
            databaseURL: "https://novatech-e7507-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "novatech-e7507"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const APP_ID = "novatech_v4_pro_ultimate";

        let userData = null;

        // AUTH LOGIC
        onAuthStateChanged(auth, async (user) => {
            const loading = document.getElementById('loading-screen');
            const authScreen = document.getElementById('auth-screen');
            const mainApp = document.getElementById('app-root');

            if (user) {
                // User is signed in
                await syncUserData(user);
                loading.style.display = 'none';
                authScreen.style.display = 'none';
                mainApp.style.display = 'block';
                initListeners();
            } else {
                // User is signed out
                loading.style.display = 'none';
                authScreen.style.display = 'flex';
                mainApp.style.display = 'none';
            }
        });

        window.handleAuthAction = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return showToast("Alanları doldurun", "error");

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                try {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    showToast("Hesap oluşturuldu ve giriş yapıldı!");
                } catch (err) {
                    showToast("Hata: " + err.message, "error");
                }
            }
        };

        // DATABASE LOGIC
        async function syncUserData(user) {
            const userRef = ref(db, `artifacts/${APP_ID}/users/${user.uid}/profile`);
            onValue(userRef, snap => {
                const data = snap.val();
                if(!data) {
                    const initial = {
                        uid: user.uid,
                        name: user.email.split('@')[0],
                        xp: 0,
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`,
                        lastReward: 0
                    };
                    set(userRef, initial);
                    update(ref(db, `artifacts/${APP_ID}/public/leaderboard/${user.uid}`), { name: initial.name, xp: 0, avatar: initial.avatar });
                } else {
                    userData = data;
                    renderProfile();
                }
            });
        }

        function renderProfile() {
            if(!userData) return;
            document.getElementById('side-name').innerText = userData.name;
            document.getElementById('user-avatar').src = userData.avatar;
            document.getElementById('side-avatar').src = userData.avatar;
            
            const level = Math.floor(userData.xp / 1000);
            const xpInLevel = userData.xp % 1000;
            document.getElementById('xp-fill').style.width = (xpInLevel / 10) + "%";
            document.getElementById('xp-text').innerText = `${xpInLevel} / 1000 XP (Seviye ${level + 1})`;
        }

        function initListeners() {
            // Forum Feed
            onValue(ref(db, `artifacts/${APP_ID}/public/posts`), snap => {
                const container = document.getElementById('feed-container');
                container.innerHTML = "";
                const data = snap.val();
                if(!data) return;
                Object.values(data).reverse().forEach(post => {
                    container.innerHTML += `
                        <div class="card">
                            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                                <img src="${post.avatar}" style="width:30px; height:30px; border-radius:50%;">
                                <b>${post.author}</b>
                                <span style="font-size:0.7rem; color:var(--text-dim); margin-left:auto;">${new Date(post.ts).toLocaleTimeString()}</span>
                            </div>
                            <p>${post.content}</p>
                        </div>
                    `;
                });
            });

            // Leaderboard
            onValue(ref(db, `artifacts/${APP_ID}/public/leaderboard`), snap => {
                const container = document.getElementById('leaderboard-content');
                container.innerHTML = "<h3>Liderlik Tablosu</h3>";
                const data = snap.val();
                if(!data) return;
                Object.values(data).sort((a,b) => b.xp - a.xp).slice(0, 10).forEach((u, i) => {
                    container.innerHTML += `
                        <div style="display:flex; align-items:center; gap:15px; padding:10px; border-bottom:1px solid var(--border);">
                            <span style="font-weight:800; width:20px;">${i+1}</span>
                            <img src="${u.avatar}" style="width:30px; height:30px; border-radius:50%;">
                            <span style="flex:1">${u.name}</span>
                            <b style="color:var(--primary)">${u.xp} XP</b>
                        </div>
                    `;
                });
            });
        }

        // ACTIONS
        window.addXP = async (amount) => {
            const newXp = (userData.xp || 0) + amount;
            await update(ref(db, `artifacts/${APP_ID}/users/${auth.currentUser.uid}/profile`), { xp: newXp });
            await update(ref(db, `artifacts/${APP_ID}/public/leaderboard/${auth.currentUser.uid}`), { xp: newXp });
        };

        window.submitPost = async () => {
            const text = document.getElementById('post-text').value.trim();
            if(!text) return;
            await push(ref(db, `artifacts/${APP_ID}/public/posts`), {
                author: userData.name,
                avatar: userData.avatar,
                content: text,
                ts: Date.now()
            });
            document.getElementById('post-text').value = "";
            addXP(10);
            showToast("Paylaşıldı! +10 XP");
        };

        window.saveStudy = () => {
            const lesson = document.getElementById('lesson-name').value;
            const q = document.getElementById('q-count').value;
            if(!lesson || !q) return;
            addXP(50);
            showToast("Harika çalışma! +50 XP");
            document.getElementById('lesson-name').value = "";
            document.getElementById('q-count').value = "";
        };

        window.claimDailyReward = async () => {
            const now = Date.now();
            if(now - (userData.lastReward || 0) < 24*60*60*1000) return showToast("Bugün zaten aldın!", "error");
            await update(ref(db, `artifacts/${APP_ID}/users/${auth.currentUser.uid}/profile`), { lastReward: now });
            addXP(100);
            showToast("Günlük bonus! +100 XP");
        };

        window.updateName = async () => {
            const newName = document.getElementById('name-change').value.trim();
            if(newName.length < 3) return;
            await update(ref(db, `artifacts/${APP_ID}/users/${auth.currentUser.uid}/profile`), { name: newName });
            await update(ref(db, `artifacts/${APP_ID}/public/leaderboard/${auth.currentUser.uid}`), { name: newName });
            showToast("İsim güncellendi!");
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'block';
            event.currentTarget.classList.add('active');
            if(window.innerWidth < 900) document.getElementById('sidebar').classList.remove('open');
        };

        window.showToast = (msg, type = "success") => {
            const c = document.getElementById('notification-container');
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.borderLeft = `5px solid ${type === 'success' ? 'var(--accent)' : 'var(--danger)'}`;
            t.innerText = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };

        window.logout = () => signOut(auth);

    </script>
</body>
</html>
