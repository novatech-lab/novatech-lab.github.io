<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Social - Email Login Sürümü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); }
        .dark .glass-effect { background: rgba(15, 23, 42, 0.85); }
        .auth-card { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Kimlik Doğrulama Ekranı (Başlangıçta Gizli) -->
    <div id="auth-screen" class="fixed inset-0 z-[1000] bg-slate-50 dark:bg-slate-950 flex items-center justify-center hidden p-4">
        <div class="auth-card bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl border border-slate-200 dark:border-slate-800 w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-cyan-600 mb-2">NOVA</h1>
                <p id="auth-subtitle" class="text-slate-500 text-sm">Dünyaya bağlanmak için giriş yapın</p>
            </div>

            <div class="space-y-4">
                <div id="register-only-fields" class="hidden space-y-4">
                    <input id="auth-name" type="text" placeholder="Ad Soyad" class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-2xl py-3 px-5 outline-none focus:ring-2 focus:ring-cyan-500 dark:text-white">
                </div>
                <input id="auth-email" type="email" placeholder="E-posta" class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-2xl py-3 px-5 outline-none focus:ring-2 focus:ring-cyan-500 dark:text-white">
                <input id="auth-password" type="password" placeholder="Şifre" class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-2xl py-3 px-5 outline-none focus:ring-2 focus:ring-cyan-500 dark:text-white">
                
                <p id="auth-error" class="text-red-500 text-xs text-center hidden"></p>

                <button id="auth-main-btn" onclick="handleAuthSubmit()" class="w-full bg-cyan-600 text-white py-4 rounded-2xl font-bold hover:bg-cyan-700 transition shadow-lg shadow-cyan-100 dark:shadow-none">Giriş Yap</button>
                
                <div class="text-center mt-6">
                    <button id="auth-toggle-btn" onclick="toggleAuthMode()" class="text-sm text-cyan-600 font-semibold hover:underline">Hesabınız yok mu? Kayıt Olun</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ana Uygulama Arayüzü -->
    <div id="app-container" class="hidden">
        <nav class="sticky top-0 z-50 glass-effect border-b border-slate-200 dark:border-slate-800 px-4 py-3">
            <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
                <h1 onclick="location.reload()" class="text-2xl font-extrabold text-cyan-600 tracking-tight cursor-pointer">NOVA</h1>
                <div class="relative flex-1 max-w-md">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                        <input id="search-input" type="text" placeholder="Arkadaşlarını ara..." class="w-full bg-slate-100 dark:bg-slate-900 border-none rounded-2xl py-2 pl-10 pr-4 focus:ring-2 focus:ring-cyan-500 transition text-sm outline-none">
                    </div>
                    <div id="search-results" class="absolute top-full mt-2 w-full bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800 overflow-hidden hidden z-50"></div>
                </div>
                <div class="flex items-center gap-2 md:gap-4">
                    <button onclick="toggleTheme()" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-yellow-400"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden text-slate-600"></i>
                    </button>
                    <div class="relative group">
                        <img id="nav-avatar" src="" class="w-10 h-10 rounded-full border-2 border-cyan-100 dark:border-cyan-900 object-cover cursor-pointer bg-slate-200 dark:bg-slate-800">
                        <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800 py-2 hidden group-hover:block transition-all">
                            <button onclick="signOutUser()" class="w-full text-left px-4 py-2 text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2">
                                <i data-lucide="log-out" class="w-4 h-4"></i> Çıkış Yap
                            </button>
                            <div class="border-t border-slate-100 dark:border-slate-800 my-1"></div>
                            <button onclick="deleteAccount()" class="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-2">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> Hesabı Sil
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6 p-4 md:p-6">
            <aside class="md:col-span-3 space-y-4">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                    <h2 class="font-bold flex items-center gap-2 text-slate-800 dark:text-slate-200 mb-4">
                        <i data-lucide="layout-grid" class="w-4 h-4 text-cyan-600"></i> Kanallar
                    </h2>
                    <div class="space-y-1 text-sm">
                        <div class="bg-cyan-50 dark:bg-cyan-900/30 text-cyan-700 dark:text-cyan-400 font-bold px-4 py-2.5 rounded-xl cursor-pointer">🌍 Genel Akış</div>
                    </div>
                </div>
            </aside>

            <section class="md:col-span-6 space-y-6">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                    <div class="flex gap-4">
                        <img id="composer-avatar" src="" class="w-12 h-12 rounded-full shrink-0 object-cover bg-slate-200">
                        <textarea id="post-content" placeholder="Neler oluyor?" class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-2xl p-4 focus:ring-2 focus:ring-cyan-500 resize-none text-sm outline-none min-h-[100px] dark:text-white"></textarea>
                    </div>
                    <div class="flex justify-end mt-3">
                        <button onclick="createPost()" class="bg-cyan-600 text-white px-8 py-2 rounded-full font-bold hover:bg-cyan-700 transition">Paylaş</button>
                    </div>
                </div>
                <div id="posts-container" class="space-y-4"></div>
            </section>

            <aside class="hidden md:block md:col-span-3">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 sticky top-24">
                    <h3 class="font-bold text-sm mb-4 text-slate-800 dark:text-slate-200">Aktif Kullanıcılar</h3>
                    <div id="online-users" class="space-y-3"></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Chat Widget -->
    <div id="chat-window" class="fixed bottom-0 right-4 w-80 md:w-96 z-[100] bg-white dark:bg-slate-900 rounded-t-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col h-[480px] hidden">
        <div class="bg-cyan-600 p-4 text-white flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="chat-avatar" src="" class="w-9 h-9 rounded-full border border-white/20">
                <div>
                    <p id="chat-title" class="font-bold text-sm">Chat</p>
                    <p class="text-[10px] opacity-80 uppercase tracking-wider">Aktif</p>
                </div>
            </div>
            <button onclick="closeChat()"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 dark:bg-slate-950"></div>
        <div class="p-4 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 flex gap-2">
            <input id="chat-input" type="text" placeholder="Mesaj yaz..." class="flex-1 bg-slate-100 dark:bg-slate-800 border-none rounded-full px-5 py-2 text-xs outline-none focus:ring-1 focus:ring-cyan-500 dark:text-white">
            <button onclick="sendMessage()" class="bg-cyan-600 text-white p-2 rounded-full"><i data-lucide="send" class="w-4 h-4"></i></button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-[2rem] max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-xl font-bold mb-2 dark:text-white">Emin misiniz?</h3>
            <p id="confirm-text" class="text-sm text-slate-500 mb-6">Bu işlem geri alınamaz.</p>
            <div class="flex gap-3">
                <button onclick="hideConfirm()" class="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">Vazgeç</button>
                <button id="confirm-action-btn" class="flex-1 py-3 rounded-2xl bg-red-500 text-white font-bold text-sm">Onayla</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, serverTimestamp, getDoc, setDoc, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nova-social-auth-v2';

        let currentUser = null;
        let userData = null;
        let activeChat = null;
        let allUsers = [];
        let unsubMsgs = null;
        let isRegisterMode = false;

        // --- AUTH FLOW ---
        onAuthStateChanged(auth, async (user) => {
            const authScreen = document.getElementById('auth-screen');
            const appContainer = document.getElementById('app-container');

            if (user) {
                currentUser = user;
                await syncProfile(user);
                authScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
                initData();
            } else {
                authScreen.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        });

        window.toggleAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('register-only-fields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-main-btn').innerText = isRegisterMode ? 'Kayıt Ol' : 'Giriş Yap';
            document.getElementById('auth-subtitle').innerText = isRegisterMode ? 'Nova ailesine katılın' : 'Dünyaya bağlanmak için giriş yapın';
            document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Zaten hesabınız var mı? Giriş Yap' : 'Hesabınız yok mu? Kayıt Olun';
        };

        window.handleAuthSubmit = async () => {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value.trim();
            const errorEl = document.getElementById('auth-error');

            if (!email || !password) return;
            errorEl.classList.add('hidden');

            try {
                if (isRegisterMode) {
                    if (!name) { errorEl.innerText = "Lütfen isim girin"; errorEl.classList.remove('hidden'); return; }
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await saveNewUser(cred.user, name);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                errorEl.innerText = "Hata: " + err.message;
                errorEl.classList.remove('hidden');
            }
        };

        async function saveNewUser(user, name) {
            const newUser = {
                uid: user.uid,
                displayName: name,
                photoURL: `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`,
                createdAt: new Date().toISOString()
            };
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), newUser);
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users_index', user.uid), newUser);
        }

        async function syncProfile(user) {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'));
            if (snap.exists()) {
                userData = snap.data();
                document.getElementById('nav-avatar').src = userData.photoURL;
                document.getElementById('composer-avatar').src = userData.photoURL;
            }
        }

        window.signOutUser = () => signOut(auth);

        // --- ACCOUNT ACTIONS ---
        window.deleteAccount = () => {
            showConfirm("Hesabınızı ve tüm verilerinizi silmek istediğinizden emin misiniz?", async () => {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data'));
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users_index', currentUser.uid));
                    await deleteUser(currentUser);
                } catch (e) {
                    console.error("Hata:", e);
                }
            });
        };

        // --- THEME & HELPERS ---
        window.toggleTheme = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            lucide.createIcons();
        };

        function showConfirm(text, action) {
            document.getElementById('confirm-text').innerText = text;
            document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('confirm-action-btn').onclick = () => { action(); hideConfirm(); };
        }
        window.hideConfirm = () => document.getElementById('confirm-modal').classList.add('hidden');

        // --- DATA LOGIC ---
        function initData() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (snap) => {
                const posts = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderPosts(posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users_index'), (snap) => {
                allUsers = snap.docs.map(d => d.data());
                renderOnlineUsers(allUsers);
            });
        }

        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = posts.map(post => `
                <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200 dark:border-slate-800 group shadow-sm">
                    <div class="flex items-center gap-3 mb-4">
                        <img src="${post.authorPhoto}" class="w-10 h-10 rounded-full">
                        <div class="flex-1">
                            <p class="font-bold text-sm dark:text-white">${post.authorName}</p>
                            <p class="text-[10px] text-slate-400">Nova Sakini</p>
                        </div>
                        <button onclick="window.initiateDM('${post.authorId}', '${post.authorName}', '${post.authorPhoto}')" class="opacity-0 group-hover:opacity-100 transition text-cyan-600 p-2 rounded-full hover:bg-cyan-50 dark:hover:bg-cyan-900/30">
                            <i data-lucide="message-square" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="text-slate-700 dark:text-slate-300 text-[15px] mb-4">${post.content}</p>
                    <div class="border-t dark:border-slate-800 pt-3 flex">
                        <button onclick="window.likePost('${post.id}')" class="flex items-center gap-1.5 text-xs ${post.likes?.includes(currentUser.uid) ? 'text-rose-500 font-bold' : 'text-slate-400'}">
                            <i data-lucide="heart" class="w-4 h-4 ${post.likes?.includes(currentUser.uid) ? 'fill-current' : ''}"></i> ${post.likes?.length || 0}
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderOnlineUsers(users) {
            const container = document.getElementById('online-users');
            container.innerHTML = users.map(u => `
                <div onclick="window.initiateDM('${u.uid}', '${u.displayName}', '${u.photoURL}')" class="flex items-center gap-3 p-2 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-2xl cursor-pointer transition">
                    <img src="${u.photoURL}" class="w-8 h-8 rounded-full border dark:border-slate-800">
                    <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">${u.displayName}</span>
                </div>
            `).join('');
        }

        window.createPost = async () => {
            const input = document.getElementById('post-content');
            if (!input.value.trim()) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
                content: input.value, authorId: currentUser.uid, authorName: userData.displayName, authorPhoto: userData.photoURL, likes: [], createdAt: serverTimestamp()
            });
            input.value = "";
        };

        window.likePost = async (id) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'posts', id);
            const snap = await getDoc(ref);
            const likes = snap.data().likes || [];
            await updateDoc(ref, { likes: likes.includes(currentUser.uid) ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
        };

        window.initiateDM = (uid, name, photo) => {
            if (uid === currentUser.uid) return;
            const roomId = [currentUser.uid, uid].sort().join("_");
            activeChat = { roomId, name, photo };
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('chat-title').innerText = name;
            document.getElementById('chat-avatar').src = photo;
            if (unsubMsgs) unsubMsgs();
            unsubMsgs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'chats', roomId, 'messages'), (snap) => {
                const msgs = snap.docs.map(d => d.data()).sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                renderMessages(msgs);
            });
        };

        function renderMessages(msgs) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = msgs.map(m => `
                <div class="flex ${m.senderId === currentUser.uid ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[85%] px-4 py-2 rounded-2xl text-xs ${m.senderId === currentUser.uid ? 'bg-cyan-600 text-white rounded-tr-none' : 'bg-white dark:bg-slate-800 dark:text-slate-200 rounded-tl-none'} shadow-sm">
                        ${m.text}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        window.sendMessage = async () => {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() || !activeChat) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chats', activeChat.roomId, 'messages'), {
                text: input.value, senderId: currentUser.uid, createdAt: serverTimestamp()
            });
            input.value = "";
        };

        window.closeChat = () => {
            document.getElementById('chat-window').classList.add('hidden');
            if (unsubMsgs) unsubMsgs();
        };

        lucide.createIcons();
    </script>
</body>
</html>
