<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaTech | Gelişmiş Öğrenci Sosyal Paneli</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg: #080a0f;
            --card-bg: #11141d;
            --border: #1e2532;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --xp-color: #fbce44;
            --sidebar-w: 260px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; overflow-x: hidden; line-height: 1.5; }

        /* Notifications */
        #notify-box { position: fixed; top: 15px; right: 15px; z-index: 9999; width: 300px; pointer-events: none; }
        .toast { background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease-out forwards; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Layout */
        header { height: 70px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 1000; }
        .layout { display: flex; max-width: 1400px; margin: 0 auto; position: relative; }
        .sidebar { width: var(--sidebar-w); height: calc(100vh - 70px); position: sticky; top: 70px; border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .content { flex: 1; padding: 20px; min-height: calc(100vh - 70px); }

        /* UI Elements */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .btn { border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; transition: 0.2s; }
        .btn-p { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-p:hover { background: #4f46e5; transform: translateY(-1px); }
        .btn-s { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border); }
        .btn-d { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        input, select, textarea { width: 100%; background: #000; border: 1px solid var(--border); padding: 10px; border-radius: 10px; color: #fff; outline: none; margin-bottom: 10px; font-family: inherit; }
        
        /* Stats */
        .xp-bar-container { margin: 10px 0; }
        .xp-bar-outer { height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
        .xp-bar-inner { height: 100%; background: var(--xp-color); width: 0%; transition: 1.5s cubic-bezier(0.19, 1, 0.22, 1); }

        /* Forum */
        .post { border: 1px solid var(--border); border-radius: 16px; background: var(--card-bg); padding: 16px; margin-bottom: 16px; }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .p-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #222; }
        .p-content { font-size: 0.95rem; margin-bottom: 12px; white-space: pre-wrap; }
        .p-img { width: 100%; border-radius: 12px; margin-bottom: 12px; display: block; }
        .p-actions { display: flex; gap: 15px; border-top: 1px solid var(--border); padding-top: 12px; }
        .p-btn { cursor: pointer; color: var(--text-muted); font-size: 0.8rem; display: flex; align-items: center; gap: 5px; font-weight: 600; }
        .p-btn.liked { color: var(--danger); }
        .p-comment-box { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }

        /* Mobile Adjustments */
        @media (max-width: 800px) {
            .sidebar { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 65px; top: auto; border-right: none; border-top: 1px solid var(--border); display: flex; padding: 0; z-index: 1001; background: var(--card-bg); }
            .sidebar nav { display: flex; width: 100%; justify-content: space-around; }
            .nav-item span { display: none; }
            .nav-item { flex: 1; height: 100%; border-radius: 0; justify-content: center; }
            .sidebar .user-card { display: none; }
            header { padding: 0 15px; }
            .content { padding-bottom: 80px; }
            .layout-grid { grid-template-columns: 1fr !important; }
        }

        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: 10px; font-weight: 500; cursor: pointer; }
        .nav-item:hover { color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .nav-item.active { color: #fff; background: var(--primary); }

        .tab { display: none; }
        .tab.active { display: block; animation: fade 0.3s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="notify-box"></div>

    <!-- Auth -->
    <div id="auth-panel" style="position:fixed; inset:0; background:var(--bg); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="card" style="width:100%; max-width:380px;">
            <div style="text-align:center; margin-bottom:25px;">
                <h1 style="margin:0; font-size:1.8rem;">Nova<span style="color:var(--primary)">Tech</span></h1>
                <p style="color:var(--text-muted); font-size:0.8rem;">Eğitimde Yeni Nesil Sosyal Platform</p>
            </div>
            
            <div id="login-form">
                <input type="email" id="log-email" placeholder="E-posta">
                <input type="password" id="log-pass" placeholder="Şifre">
                <button class="btn btn-p" style="width:100%" onclick="handleAuth('login')">Giriş Yap</button>
                <p onclick="toggleAuth(false)" style="text-align:center; cursor:pointer; font-size:0.8rem; margin-top:15px; color:var(--text-muted)">Hesabın yok mu? <span style="color:var(--primary)">Kayıt Ol</span></p>
            </div>

            <div id="reg-form" style="display:none">
                <input type="text" id="reg-user" placeholder="Kullanıcı Adı">
                <input type="email" id="reg-email" placeholder="E-posta">
                <input type="password" id="reg-pass" placeholder="Şifre">
                <button class="btn btn-p" style="width:100%" onclick="handleAuth('register')">Hesap Oluştur</button>
                <p onclick="toggleAuth(true)" style="text-align:center; cursor:pointer; font-size:0.8rem; margin-top:15px; color:var(--text-muted)">Zaten üye misin? <span style="color:var(--primary)">Giriş Yap</span></p>
            </div>
        </div>
    </div>

    <!-- App UI -->
    <div id="app" style="display:none">
        <header>
            <div style="font-weight:800; font-size:1.3rem;">NOVATECH</div>
            <div style="display:flex; align-items:center; gap:12px;">
                <button class="btn btn-s" onclick="dailyCheckIn()"><i class="fas fa-calendar-check"></i> <span class="mob-hide">Günlük Yoklama</span></button>
                <div id="h-user" style="display:flex; align-items:center; gap:8px;">
                    <img id="h-avatar" src="" class="p-avatar" style="width:32px; height:32px;">
                </div>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <div class="user-card card" style="padding:15px; margin-bottom:15px;">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                        <img id="s-avatar" src="" class="p-avatar">
                        <div>
                            <div id="s-name" style="font-weight:700; font-size:0.9rem;">-</div>
                            <div id="s-title" style="font-size:0.65rem; color:var(--xp-color); font-weight:800;">SEVİYE 1</div>
                        </div>
                    </div>
                    <div class="xp-bar-container">
                        <div style="display:flex; justify-content:space-between; font-size:0.6rem; font-weight:700; margin-bottom:4px;">
                            <span id="s-xp-cur">0 XP</span>
                            <span id="s-xp-next">500 XP</span>
                        </div>
                        <div class="xp-bar-outer"><div id="s-xp-fill" class="xp-bar-inner"></div></div>
                    </div>
                </div>

                <nav>
                    <div class="nav-item active" onclick="setTab('study', this)"><i class="fas fa-pen-nib"></i> <span>Çalışma</span></div>
                    <div class="nav-item" onclick="setTab('forum', this)"><i class="fas fa-earth-americas"></i> <span>Topluluk</span></div>
                    <div class="nav-item" onclick="setTab('ranks', this)"><i class="fas fa-trophy"></i> <span>Sıralama</span></div>
                    <div class="nav-item" onclick="setTab('settings', this)"><i class="fas fa-cog"></i> <span>Profil</span></div>
                    <div class="nav-item mob-hide" onclick="doSignOut()" style="color:var(--danger); margin-top:auto;"><i class="fas fa-sign-out-alt"></i> <span>Çıkış Yap</span></div>
                </nav>
            </aside>

            <main class="content">
                <!-- STUDY -->
                <div id="tab-study" class="tab active">
                    <div class="card">
                        <h3 style="margin-top:0">Yeni Kayıt</h3>
                        <div class="layout-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                            <div>
                                <label style="font-size:0.7rem; color:var(--text-muted)">Ders Seçin</label>
                                <select id="inp-lesson" onchange="renderTopics()"></select>
                            </div>
                            <div>
                                <label style="font-size:0.7rem; color:var(--text-muted)">Konu Seçin</label>
                                <select id="inp-topic"></select>
                            </div>
                        </div>
                        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:10px;">
                            <input type="number" id="inp-d" placeholder="Doğru">
                            <input type="number" id="inp-y" placeholder="Yanlış">
                            <input type="number" id="inp-b" placeholder="Boş">
                        </div>
                        <button class="btn btn-p" style="width:100%" onclick="saveWork()">Kaydet & XP Kazan</button>
                    </div>

                    <div id="study-history"></div>
                </div>

                <!-- FORUM -->
                <div id="tab-forum" class="tab">
                    <div class="card">
                        <textarea id="p-text" placeholder="Bugün neler öğrendin?" rows="3"></textarea>
                        <div id="p-preview" style="display:none; margin-bottom:10px;">
                            <img id="p-render" style="max-height:200px; border-radius:10px;">
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <button class="btn btn-s" onclick="document.getElementById('f-img').click()"><i class="fas fa-image"></i> Görsel Ekle</button>
                            <input type="file" id="f-img" hidden accept="image/*" onchange="handleFile(event)">
                            <button class="btn btn-p" onclick="sendPost()">Paylaş</button>
                        </div>
                    </div>
                    <div id="forum-feed"></div>
                </div>

                <!-- RANKING -->
                <div id="tab-ranks" class="tab">
                    <div class="card">
                        <h2 style="text-align:center; margin-bottom:20px;">Global Sıralama</h2>
                        <div id="rank-list"></div>
                    </div>
                </div>

                <!-- SETTINGS -->
                <div id="tab-settings" class="tab">
                    <div class="card">
                        <h3>Hesabım</h3>
                        <div style="text-align:center; margin-bottom:20px;">
                            <img id="set-av" src="" class="p-avatar" style="width:80px; height:80px;">
                            <div style="margin-top:10px;">
                                <button class="btn btn-s" onclick="document.getElementById('f-av').click()">Fotoğrafı Değiştir</button>
                                <input type="file" id="f-av" hidden onchange="updateAvatar(event)">
                            </div>
                        </div>
                        <input type="text" id="set-name" placeholder="Kullanıcı Adı">
                        <button class="btn btn-p" style="width:100%" onclick="updateNick()">Bilgileri Güncelle</button>
                    </div>
                    <button class="btn btn-d" style="width:100%" onclick="deleteMyAccount()">Hesabı Tamamen Sil</button>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGFyQsqe32hGgskY5yRfrbXlH8MuHKaLE",
            authDomain: "novatech-e7507.firebaseapp.com",
            databaseURL: "https://novatech-e7507-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "novatech-e7507"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let user = null;
        let userData = null;
        let tempPostImg = null;

        const LESSONS = {
            "Matematik": ["Üslü Sayılar", "Köklü Sayılar", "Fonksiyonlar", "Polinomlar", "Türev", "İntegral", "Trigonometri", "Permütasyon", "Olasılık", "Diziler"],
            "Fizik": ["Vektörler", "Hareket", "Newton Yasaları", "Enerji", "İtme-Momentum", "Elektrik", "Manyetizma", "Optik", "Dalgalar", "Modern Fizik"],
            "Kimya": ["Atom Yapısı", "Periyodik Sistem", "Mol Kavramı", "Gazlar", "Çözeltiler", "Enerji", "Hız", "Denge", "Asit-Baz", "Organik Kimya"],
            "Biyoloji": ["Hücre", "Protein Sentezi", "Fotosentez", "Solunum", "Kalıtım", "Ekoloji", "Sistemler", "Evrim", "Canlılar Dünyası", "Üreme"],
            "Türkçe": ["Sözcük Anlamı", "Cümle Anlamı", "Paragraf", "Ses Bilgisi", "Yazım Kuralları", "Noktalama", "Sözcük Yapısı", "Cümle Öğeleri", "Anlatım Bozukluğu", "Edebiyat Türleri"],
            "Tarih": ["İslamiyet Öncesi", "İlk Türk Devletleri", "Osmanlı Kuruluş", "Osmanlı Yükselme", "Osmanlı Duraklama", "19. Yüzyıl", "Kurtuluş Savaşı", "İnkılaplar", "Çağdaş Dünya", "Atatürkçülük"],
            "Coğrafya": ["Doğa ve İnsan", "Harita Bilgisi", "İklim Tipleri", "Yer Şekilleri", "Nüfus", "Ekonomi", "Bölgeler", "Çevre", "Ulaşım", "Su Kaynakları"],
            "İngilizce": ["Grammar Basics", "Tenses", "Modals", "Passives", "Conditionals", "Vocabulary", "Reading Skills", "Writing Skills", "Listening", "Phrasal Verbs"],
            "Felsefe": ["Felsefeye Giriş", "Bilgi Felsefesi", "Varlık Felsefesi", "Ahlak Felsefesi", "Din Felsefesi", "Siyaset Felsefesi", "Sanat Felsefesi", "Bilim Felsefesi", "Antik Felsefe", "Modern Felsefe"],
            "Geometri": ["Doğruda Açılar", "Üçgenler", "Dörtgenler", "Çokgenler", "Çember", "Daire", "Analitik Geometri", "Katı Cisimler", "Dönüşümler", "Vektörler"]
        };

        const RANKS = ["Acemi", "Çaylak", "Gezgin", "Araştırmacı", "Bilgin", "Usta", "Dahi", "Efsane", "Yüce", "Mistik", "Ebedi", "Nova"];

        onAuthStateChanged(auth, u => {
            if (u) {
                user = u;
                fetchUser();
            } else {
                document.getElementById('auth-panel').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });

        async function fetchUser() {
            onValue(ref(db, `users/${user.uid}`), (snap) => {
                userData = snap.val();
                if (userData) {
                    renderSidebar();
                    document.getElementById('app').style.display = 'block';
                    document.getElementById('auth-panel').style.display = 'none';
                }
            });
            initApp();
        }

        function renderSidebar() {
            let lvl = 1;
            let req = 500;
            let temp = userData.xp || 0;
            while(temp >= req) { temp -= req; lvl++; req *= 1.8; }

            const xpPerc = (temp / req) * 100;
            const rName = RANKS[Math.min(lvl-1, RANKS.length-1)];

            document.getElementById('s-name').innerText = userData.username;
            document.getElementById('s-title').innerText = `${rName} | Lvl ${lvl}`;
            document.getElementById('s-xp-cur').innerText = `${Math.floor(temp)} XP`;
            document.getElementById('s-xp-next').innerText = `${Math.floor(req)} XP`;
            document.getElementById('s-xp-fill').style.width = xpPerc + "%";
            
            const av = userData.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`;
            document.getElementById('s-avatar').src = av;
            document.getElementById('h-avatar').src = av;
            document.getElementById('set-av').src = av;
            document.getElementById('set-name').value = userData.username;
        }

        function initApp() {
            // Lessons
            const lInp = document.getElementById('inp-lesson');
            lInp.innerHTML = Object.keys(LESSONS).map(k => `<option value="${k}">${k}</option>`).join('');
            renderTopics();

            // Feeds
            setupForum();
            setupRankList();
            setupHistory();
        }

        window.renderTopics = () => {
            const l = document.getElementById('inp-lesson').value;
            const tInp = document.getElementById('inp-topic');
            tInp.innerHTML = LESSONS[l].map(v => `<option value="${v}">${v}</option>`).join('');
        };

        // --- Core Logic ---
        window.saveWork = async () => {
            const d = parseInt(document.getElementById('inp-d').value) || 0;
            const y = parseInt(document.getElementById('inp-y').value) || 0;
            const b = parseInt(document.getElementById('inp-b').value) || 0;
            const lesson = document.getElementById('inp-lesson').value;
            const topic = document.getElementById('inp-topic').value;

            if (d === 0 && y === 0) return toast("Lütfen veri girin!", "error");

            try {
                // Hata Fix: Veri yolunu basitleştirdik
                const studyRef = ref(db, `studies/${user.uid}`);
                await push(studyRef, { lesson, topic, d, y, b, ts: Date.now() });
                
                const newXp = (userData.xp || 0) + 50;
                await update(ref(db, `users/${user.uid}`), { xp: newXp });
                
                toast("Başarıyla kaydedildi! +50 XP", "success");
                document.getElementById('inp-d').value = "";
                document.getElementById('inp-y').value = "";
            } catch(e) {
                console.error(e);
                toast("Hata: Veritabanı erişim sorunu!", "error");
            }
        };

        window.dailyCheckIn = async () => {
            const last = userData.lastCheck || 0;
            const today = new Date().setHours(0,0,0,0);
            if(last >= today) return toast("Bugün zaten yoklama verdin!", "error");

            await update(ref(db, `users/${user.uid}`), {
                xp: (userData.xp || 0) + 150,
                lastCheck: today
            });
            toast("Yoklama alındı! +150 XP", "success");
        };

        // --- Forum ---
        function setupForum() {
            onValue(ref(db, 'forum'), (snap) => {
                const feed = document.getElementById('forum-feed');
                feed.innerHTML = "";
                const data = snap.val();
                if(!data) return;

                Object.keys(data).reverse().forEach(id => {
                    const p = data[id];
                    const likeCount = p.likes ? Object.keys(p.likes).length : 0;
                    const isLiked = p.likes && p.likes[user.uid];

                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <div class="post-header">
                            <img src="${p.avatar}" class="p-avatar">
                            <div style="flex:1">
                                <div style="font-weight:700; font-size:0.85rem;">${p.author}</div>
                                <div style="font-size:0.65rem; color:var(--text-muted)">${new Date(p.ts).toLocaleString()}</div>
                            </div>
                            ${p.uid === user.uid ? `<i class="fas fa-trash" style="cursor:pointer; color:var(--danger); font-size:0.8rem;" onclick="deletePost('${id}')"></i>` : ''}
                        </div>
                        <div class="p-content">${p.text}</div>
                        ${p.img ? `<img src="${p.img}" class="p-img">` : ''}
                        <div class="p-actions">
                            <div class="p-btn ${isLiked?'liked':''}" onclick="handleLike('${id}')"><i class="${isLiked?'fas':'far'} fa-heart"></i> ${likeCount}</div>
                            <div class="p-btn" onclick="toggleComments('${id}')"><i class="far fa-comment"></i> Yorumlar</div>
                        </div>
                        <div id="com-${id}" class="p-comment-box">
                            <div id="clist-${id}" style="margin-bottom:10px;"></div>
                            <div style="display:flex; gap:8px;">
                                <input type="text" id="cinp-${id}" placeholder="Mesaj yaz..." style="margin:0; font-size:0.8rem;">
                                <button class="btn btn-p" onclick="addComment('${id}')" style="padding:5px 10px"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                    `;
                    feed.appendChild(div);

                    if(p.comments) {
                        const clist = document.getElementById(`clist-${id}`);
                        Object.values(p.comments).forEach(c => {
                            clist.innerHTML += `<div style="font-size:0.75rem; margin-bottom:5px;"><b>${c.user}:</b> ${c.text}</div>`;
                        });
                    }
                });
            });
        }

        window.sendPost = async () => {
            const text = document.getElementById('p-text').value;
            if(!text && !tempPostImg) return;
            await push(ref(db, 'forum'), {
                uid: user.uid,
                author: userData.username,
                avatar: userData.avatar || "",
                text,
                img: tempPostImg,
                ts: Date.now()
            });
            document.getElementById('p-text').value = "";
            tempPostImg = null;
            document.getElementById('p-preview').style.display = 'none';
            toast("Paylaşıldı!");
        };

        window.handleLike = async (id) => {
            const likeRef = ref(db, `forum/${id}/likes/${user.uid}`);
            const check = await get(likeRef);
            if(check.exists()) await remove(likeRef);
            else await set(likeRef, true);
        };

        window.toggleComments = (id) => {
            const el = document.getElementById(`com-${id}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        };

        window.addComment = async (id) => {
            const inp = document.getElementById(`cinp-${id}`);
            if(!inp.value) return;
            await push(ref(db, `forum/${id}/comments`), {
                user: userData.username,
                text: inp.value
            });
            inp.value = "";
        };

        window.deletePost = async (id) => {
            if(confirm("Bu paylaşımı silmek istediğine emin misin?")) {
                await remove(ref(db, `forum/${id}`));
                toast("Silindi.");
            }
        };

        // --- Ranking ---
        function setupRankList() {
            onValue(ref(db, 'users'), snap => {
                const list = document.getElementById('rank-list');
                list.innerHTML = "";
                const users = Object.values(snap.val() || {}).sort((a,b) => (b.xp||0) - (a.xp||0));
                users.forEach((u, i) => {
                    list.innerHTML += `
                        <div style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--border); ${u.uid===user.uid?'background:rgba(99,102,241,0.1); border-radius:10px':''}">
                            <span style="font-weight:900; width:20px;">${i+1}</span>
                            <img src="${u.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed='+u.uid}" style="width:30px; height:30px; border-radius:50%">
                            <div style="flex:1">
                                <div style="font-weight:700; font-size:0.85rem;">${u.username}</div>
                            </div>
                            <div style="font-weight:800; color:var(--xp-color); font-size:0.8rem;">${u.xp || 0} XP</div>
                        </div>
                    `;
                });
            });
        }

        // --- History ---
        function setupHistory() {
            onValue(ref(db, `studies/${user.uid}`), snap => {
                const h = document.getElementById('study-history');
                h.innerHTML = "";
                const data = snap.val();
                if(!data) return;
                Object.values(data).reverse().slice(0, 10).forEach(s => {
                    h.innerHTML += `
                        <div class="card" style="padding:12px; margin-bottom:10px; font-size:0.8rem;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                                <b>${s.lesson}</b>
                                <span style="color:var(--accent)">${s.d}D / ${s.y}Y</span>
                            </div>
                            <div style="color:var(--text-muted)">${s.topic}</div>
                        </div>
                    `;
                });
            });
        }

        // --- System ---
        window.handleFile = (e) => {
            const r = new FileReader();
            r.onload = ev => {
                tempPostImg = ev.target.result;
                document.getElementById('p-preview').style.display = 'block';
                document.getElementById('p-render').src = tempPostImg;
            };
            r.readAsDataURL(e.target.files[0]);
        };

        window.updateAvatar = (e) => {
            const r = new FileReader();
            r.onload = async ev => {
                const b64 = ev.target.result;
                await update(ref(db, `users/${user.uid}`), { avatar: b64 });
                toast("Profil fotoğrafı güncellendi.");
            };
            r.readAsDataURL(e.target.files[0]);
        };

        window.updateNick = async () => {
            const n = document.getElementById('set-name').value;
            if(n.length < 3) return toast("İsim çok kısa!", "error");
            await update(ref(db, `users/${user.uid}`), { username: n });
            toast("Kullanıcı adı güncellendi.");
        };

        window.deleteMyAccount = async () => {
            if(confirm("HESABINI SİLMEK ÜZERESİN! Tüm verilerin yok olacak. Emin misin?")) {
                const uid = user.uid;
                await remove(ref(db, `users/${uid}`));
                await remove(ref(db, `studies/${uid}`));
                await deleteUser(user).catch(() => toast("Hata: Yeniden giriş yapmalısın.", "error"));
            }
        };

        window.toast = (msg, type = "success") => {
            const b = document.getElementById('notify-box');
            const t = document.createElement('div');
            t.className = 'toast';
            if(type === 'error') t.style.borderLeftColor = 'var(--danger)';
            t.innerHTML = `<span>${msg}</span>`;
            b.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };

        window.setTab = (id, btn) => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            btn.classList.add('active');
        };

        window.toggleAuth = (isLogin) => {
            document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
            document.getElementById('reg-form').style.display = isLogin ? 'none' : 'block';
        };

        window.handleAuth = async (type) => {
            try {
                if(type === 'login') {
                    const e = document.getElementById('log-email').value;
                    const p = document.getElementById('log-pass').value;
                    await signInWithEmailAndPassword(auth, e, p);
                    toast("Giriş başarılı!");
                } else {
                    const u = document.getElementById('reg-user').value;
                    const e = document.getElementById('reg-email').value;
                    const p = document.getElementById('reg-pass').value;
                    if(u.length < 2) throw new Error("Kullanıcı adı girin!");
                    const res = await createUserWithEmailAndPassword(auth, e, p);
                    await set(ref(db, `users/${res.user.uid}`), {
                        uid: res.user.uid,
                        username: u,
                        xp: 0,
                        avatar: ""
                    });
                    toast("Kayıt başarılı!");
                }
            } catch(e) { toast(e.message, "error"); }
        };

        window.doSignOut = () => signOut(auth);

    </script>
</body>
</html>
