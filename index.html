<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Social - Tam Sürüm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .chat-height { height: calc(100% - 110px); }
        .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass-effect border-b border-slate-200 px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <h1 class="text-2xl font-extrabold text-cyan-600 tracking-tight cursor-pointer">NOVA</h1>
            
            <div class="relative flex-1 max-w-md">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                    <input id="search-input" type="text" placeholder="Arkadaşlarını ara..." 
                           class="w-full bg-slate-100 border-none rounded-2xl py-2 pl-10 pr-4 focus:ring-2 focus:ring-cyan-500 transition text-sm outline-none">
                </div>
                <div id="search-results" class="absolute top-full mt-2 w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden hidden z-50"></div>
            </div>

            <div class="flex items-center gap-3">
                <img id="nav-avatar" src="" class="w-10 h-10 rounded-full border-2 border-cyan-100 object-cover cursor-pointer bg-slate-200">
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6 p-4 md:p-6">
        
        <!-- Sol Panel -->
        <aside class="md:col-span-3 space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                <h2 class="font-bold flex items-center gap-2 text-slate-800 mb-4">
                    <i data-lucide="layout-grid" class="w-4 h-4 text-cyan-600"></i> Kanallar
                </h2>
                <div class="space-y-1 text-sm">
                    <div class="bg-cyan-50 text-cyan-700 font-bold px-4 py-2.5 rounded-xl cursor-pointer">🌍 Genel Akış</div>
                    <div class="hover:bg-slate-50 px-4 py-2.5 rounded-xl cursor-pointer text-slate-500 transition"># Teknoloji</div>
                    <div class="hover:bg-slate-50 px-4 py-2.5 rounded-xl cursor-pointer text-slate-500 transition"># Tasarım</div>
                </div>
            </div>
        </aside>

        <!-- Orta Panel -->
        <section class="md:col-span-6 space-y-6">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex gap-4">
                    <img id="composer-avatar" src="" class="w-12 h-12 rounded-full shrink-0 object-cover bg-slate-200">
                    <textarea id="post-content" placeholder="Neler oluyor?" 
                              class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-cyan-500 resize-none text-sm outline-none min-h-[100px]"></textarea>
                </div>
                <div class="flex justify-end mt-3">
                    <button onclick="createPost()" class="bg-cyan-600 text-white px-8 py-2 rounded-full font-bold hover:bg-cyan-700 transition shadow-lg shadow-cyan-100">Paylaş</button>
                </div>
            </div>

            <div id="posts-container" class="space-y-4">
                <div class="text-center py-10 text-slate-400">Yükleniyor...</div>
            </div>
        </section>

        <!-- Sağ Panel -->
        <aside class="hidden md:block md:col-span-3">
            <div class="bg-white p-5 rounded-3xl border border-slate-200">
                <h3 class="font-bold text-sm mb-4 text-slate-800">Aktif Kullanıcılar</h3>
                <div id="online-users" class="space-y-3">
                    <!-- JS ile dolacak -->
                </div>
            </div>
        </aside>
    </main>

    <!-- Chat Window -->
    <div id="chat-window" class="fixed bottom-0 right-4 w-80 md:w-96 z-[100] bg-white rounded-t-3xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col h-[480px] hidden">
        <div class="bg-cyan-600 p-4 text-white flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="chat-avatar" src="" class="w-9 h-9 rounded-full border border-white/20 object-cover">
                <div>
                    <p id="chat-title" class="font-bold text-sm">Chat</p>
                    <p class="text-[10px] opacity-80 uppercase tracking-wider">Şimdi Aktif</p>
                </div>
            </div>
            <button onclick="closeChat()" class="hover:bg-cyan-700 p-1 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 chat-height"></div>
        <div class="p-4 bg-white border-t flex gap-2">
            <input id="chat-input" type="text" placeholder="Mesaj yaz..." 
                   class="flex-1 bg-slate-100 border-none rounded-full px-5 py-2.5 text-xs outline-none focus:ring-1 focus:ring-cyan-500">
            <button onclick="sendMessage()" class="bg-cyan-600 text-white p-2.5 rounded-full hover:bg-cyan-700 transition shadow-md">
                <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, query, where, serverTimestamp, getDoc, setDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nova-social-final';

        let currentUser = null;
        let userData = null;
        let activeChat = null;
        let allUsers = [];
        let unsubMsgs = null;

        // --- AUTH & USER SYNC ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await syncProfile(user);
                initData();
            } else {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            }
        });

        async function syncProfile(user) {
            const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
            const snap = await getDoc(userRef);
            
            if (!snap.exists()) {
                userData = {
                    uid: user.uid,
                    displayName: `Nova_${user.uid.slice(0, 5)}`,
                    photoURL: `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`,
                    createdAt: new Date().toISOString()
                };
                await setDoc(userRef, userData);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users_index', user.uid), userData);
            } else {
                userData = snap.data();
            }
            document.getElementById('nav-avatar').src = userData.photoURL;
            document.getElementById('composer-avatar').src = userData.photoURL;
        }

        // --- REALTIME DATA ---
        function initData() {
            // Posts
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (snapshot) => {
                const posts = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                renderPosts(posts.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
            });

            // Users index
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users_index'), (snapshot) => {
                allUsers = snapshot.docs.map(d => d.data());
                renderOnlineUsers(allUsers);
            });
        }

        // --- UI RENDERING ---
        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            if (posts.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-400 italic">Henüz bir paylaşım yok.</div>';
                return;
            }
            container.innerHTML = posts.map(post => `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-5 group transition hover:shadow-md">
                    <div class="flex items-center gap-3 mb-4">
                        <img src="${post.authorPhoto}" class="w-10 h-10 rounded-full object-cover">
                        <div class="flex-1">
                            <p class="font-bold text-sm text-slate-800">${post.authorName}</p>
                            <p class="text-[10px] text-slate-400">Nova Platform</p>
                        </div>
                        <button onclick="window.initiateDM('${post.authorId}', '${post.authorName}', '${post.authorPhoto}')" 
                                class="opacity-0 group-hover:opacity-100 transition text-cyan-600 hover:bg-cyan-50 p-2 rounded-full">
                            <i data-lucide="message-square" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="text-slate-700 text-[15px] leading-relaxed mb-4">${post.content}</p>
                    <div class="flex gap-4 border-t pt-3">
                        <button onclick="window.likePost('${post.id}')" class="flex items-center gap-1.5 text-xs ${post.likes?.includes(currentUser.uid) ? 'text-rose-500 font-bold' : 'text-slate-400'}">
                            <i data-lucide="heart" class="w-4 h-4 ${post.likes?.includes(currentUser.uid) ? 'fill-current' : ''}"></i> ${post.likes?.length || 0}
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderOnlineUsers(users) {
            const container = document.getElementById('online-users');
            container.innerHTML = users.slice(0, 10).map(u => `
                <div onclick="window.initiateDM('${u.uid}', '${u.displayName}', '${u.photoURL}')" 
                     class="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-2xl cursor-pointer transition">
                    <div class="relative">
                        <img src="${u.photoURL}" class="w-8 h-8 rounded-full border border-slate-100 object-cover">
                        <div class="absolute bottom-0 right-0 w-2 h-2 bg-green-500 border border-white rounded-full"></div>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">${u.displayName}</span>
                </div>
            `).join('');
        }

        // --- GLOBAL ACTIONS ---
        window.createPost = async () => {
            const input = document.getElementById('post-content');
            const content = input.value.trim();
            if (!content) return;

            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
                content,
                authorId: currentUser.uid,
                authorName: userData.displayName,
                authorPhoto: userData.photoURL,
                likes: [],
                createdAt: serverTimestamp()
            });
            input.value = "";
        };

        window.likePost = async (id) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'posts', id);
            const snap = await getDoc(ref);
            const likes = snap.data().likes || [];
            const isLiked = likes.includes(currentUser.uid);
            await updateDoc(ref, {
                likes: isLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
            });
        };

        window.initiateDM = (uid, name, photo) => {
            if (uid === currentUser.uid) return;
            const roomId = [currentUser.uid, uid].sort().join("_");
            activeChat = { roomId, uid, name, photo };
            
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('chat-title').innerText = name;
            document.getElementById('chat-avatar').src = photo;

            if (unsubMsgs) unsubMsgs();
            
            const qMsgs = collection(db, 'artifacts', appId, 'public', 'data', 'chats', roomId, 'messages');
            unsubMsgs = onSnapshot(qMsgs, (snapshot) => {
                const msgs = snapshot.docs.map(d => d.data()).sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                renderMessages(msgs);
            });
        };

        function renderMessages(msgs) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = msgs.map(m => `
                <div class="flex ${m.senderId === currentUser.uid ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[85%] px-4 py-2.5 rounded-[20px] text-xs shadow-sm 
                        ${m.senderId === currentUser.uid ? 'bg-cyan-600 text-white rounded-tr-none' : 'bg-white text-slate-700 rounded-tl-none border border-slate-100'}">
                        ${m.text}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        window.sendMessage = async () => {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeChat) return;

            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chats', activeChat.roomId, 'messages'), {
                text,
                senderId: currentUser.uid,
                createdAt: serverTimestamp()
            });
            input.value = "";
        };

        window.closeChat = () => {
            document.getElementById('chat-window').classList.add('hidden');
            if (unsubMsgs) unsubMsgs();
        };

        // --- SEARCH SYSTEM ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            if (!term) { resultsDiv.classList.add('hidden'); return; }

            const filtered = allUsers.filter(u => u.displayName.toLowerCase().includes(term) && u.uid !== currentUser.uid);
            if (filtered.length > 0) {
                resultsDiv.innerHTML = filtered.map(u => `
                    <div onclick="window.initiateDM('${u.uid}', '${u.displayName}', '${u.photoURL}')" 
                         class="flex items-center gap-3 p-4 hover:bg-slate-50 cursor-pointer border-b border-slate-50 last:border-none">
                        <img src="${u.photoURL}" class="w-10 h-10 rounded-full object-cover">
                        <div class="flex-1">
                            <p class="font-bold text-sm">${u.displayName}</p>
                            <p class="text-[10px] text-slate-400">Hemen mesaj at</p>
                        </div>
                        <i data-lucide="message-circle" class="w-4 h-4 text-cyan-500"></i>
                    </div>
                `).join('');
                resultsDiv.classList.remove('hidden');
                lucide.createIcons();
            } else {
                resultsDiv.classList.add('hidden');
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
