<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaTech Ultra | Eğitim ve Sosyal Platform</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg: #030508;
            --card: #0c0f16;
            --border: #1e2532;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #10b981;
            --danger: #ef4444;
            --text: #f9fafb;
            --text-dim: #94a3b8;
            --xp: #fbce44;
            --nav-h: 70px;
            --sidebar-w: 280px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- Notifications --- */
        #notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }

        /* --- Layout --- */
        .app-container { display: flex; min-height: 100vh; }
        
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-h);
            background: rgba(12, 15, 22, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 900;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: var(--nav-h);
            bottom: 0;
            z-index: 800;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-w);
            margin-top: var(--nav-h);
            padding: 30px;
            max-width: 1200px;
        }

        /* --- Components --- */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        input, select, textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        /* --- XP System --- */
        .xp-container { margin-top: 15px; }
        .xp-header { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 800; margin-bottom: 6px; }
        .xp-bar { height: 8px; background: #1e293b; border-radius: 10px; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); width: 0%; transition: 1s ease-out; }

        /* --- Navigation --- */
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: 14px;
            margin-bottom: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-link:hover { background: rgba(255,255,255,0.03); color: var(--text); }
        .nav-link.active { background: var(--primary); color: white; }

        /* --- Social Forum --- */
        .post { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); background: #111; }
        .post-img { width: 100%; border-radius: 15px; margin: 15px 0; max-height: 400px; object-fit: cover; }
        .post-actions { display: flex; gap: 20px; padding-top: 15px; border-top: 1px solid var(--border); }
        .action-item { cursor: pointer; color: var(--text-dim); font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .action-item.liked { color: var(--danger); }

        /* --- Mobile Responsive --- */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                top: auto;
                width: 100%;
                height: 75px;
                flex-direction: row;
                padding: 0 10px;
                border-right: none;
                border-top: 1px solid var(--border);
                justify-content: space-around;
                align-items: center;
            }
            .sidebar .user-info, .sidebar .nav-link span, .sidebar .desktop-only { display: none; }
            .nav-link { margin: 0; padding: 15px; }
            .main-content { margin-left: 0; padding: 20px 15px 100px 15px; }
            header { padding: 0 15px; }
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeInUp 0.4s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #auth-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <!-- Auth Panel -->
    <div id="auth-overlay">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 2rem; letter-spacing: -1px;">NOVA<span style="color:var(--primary)">TECH</span></h1>
                <p style="color:var(--text-dim); font-size: 0.85rem;">Eğitimin Geleceğine Hoş Geldin</p>
            </div>
            
            <div id="login-box">
                <input type="email" id="auth-email" placeholder="E-posta">
                <input type="password" id="auth-pass" placeholder="Şifre">
                <button class="btn btn-primary" style="width:100%" onclick="handleAuth('login')">Giriş Yap</button>
                <p style="margin-top:20px; text-align:center; font-size:0.8rem; color:var(--text-dim)">Hesabın yok mu? <span style="color:var(--primary); cursor:pointer" onclick="toggleAuth(false)">Kayıt Ol</span></p>
            </div>

            <div id="register-box" style="display:none">
                <input type="text" id="reg-name" placeholder="Kullanıcı Adı">
                <input type="email" id="reg-email" placeholder="E-posta">
                <input type="password" id="reg-pass" placeholder="Şifre">
                <button class="btn btn-primary" style="width:100%" onclick="handleAuth('register')">Hesap Oluştur</button>
                <p style="margin-top:20px; text-align:center; font-size:0.8rem; color:var(--text-dim)">Üye misin? <span style="color:var(--primary); cursor:pointer" onclick="toggleAuth(true)">Giriş Yap</span></p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none">
        <header>
            <div style="font-weight: 800; font-size: 1.1rem;">NOVATECH <span style="color:var(--primary)">V4</span></div>
            <div style="display:flex; align-items:center; gap:12px;">
                <button class="btn btn-secondary" onclick="dailyCheckIn()"><i class="fas fa-calendar-check" style="color:var(--xp)"></i> <span class="desktop-only">Yoklama</span></button>
                <img id="nav-avatar" src="" class="avatar" style="width:35px; height:35px;">
            </div>
        </header>

        <div class="app-container">
            <aside class="sidebar">
                <div class="user-info card" style="background: rgba(255,255,255,0.02); padding: 15px; border-style: dashed;">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img id="side-avatar" src="" class="avatar">
                        <div style="overflow:hidden">
                            <div id="user-display-name" style="font-weight:800; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Yükleniyor...</div>
                            <div id="user-rank-name" style="color:var(--xp); font-size:0.65rem; font-weight:900; text-transform:uppercase;">ACEMİ</div>
                        </div>
                    </div>
                    <div class="xp-container">
                        <div class="xp-header">
                            <span id="xp-text-cur">0 XP</span>
                            <span id="xp-text-max">500 XP</span>
                        </div>
                        <div class="xp-bar"><div id="xp-inner-bar" class="xp-fill"></div></div>
                    </div>
                </div>

                <nav style="flex:1">
                    <div class="nav-link active" onclick="switchTab('study', this)"><i class="fas fa-book-open"></i> <span>Çalışma Paneli</span></div>
                    <div class="nav-link" onclick="switchTab('forum', this)"><i class="fas fa-globe"></i> <span>Topluluk</span></div>
                    <div class="nav-link" onclick="switchTab('ranks', this)"><i class="fas fa-crown"></i> <span>Sıralama</span></div>
                    <div class="nav-link" onclick="switchTab('profile', this)"><i class="fas fa-user"></i> <span>Profil Ayarları</span></div>
                </nav>

                <div class="nav-link desktop-only" onclick="logout()" style="color:var(--danger); margin-top: auto; border: 1px solid rgba(239,68,68,0.1)">
                    <i class="fas fa-sign-out-alt"></i> <span>Çıkış Yap</span>
                </div>
            </aside>

            <main class="main-content">
                <!-- STUDY -->
                <div id="tab-study" class="tab-content active">
                    <div class="card">
                        <h3 style="margin-bottom:15px;"><i class="fas fa-plus-circle" style="color:var(--primary)"></i> Yeni Kayıt</h3>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                            <div>
                                <label style="font-size:0.7rem; color:var(--text-dim); font-weight:800;">DERS</label>
                                <select id="study-lesson" onchange="loadTopics()"></select>
                            </div>
                            <div>
                                <label style="font-size:0.7rem; color:var(--text-dim); font-weight:800;">KONU</label>
                                <select id="study-topic"></select>
                            </div>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:10px;">
                            <input type="number" id="val-d" placeholder="Doğru">
                            <input type="number" id="val-y" placeholder="Yanlış">
                            <input type="number" id="val-b" placeholder="Boş">
                        </div>
                        <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="saveStudy()">Verileri Kaydet</button>
                    </div>

                    <h4 style="margin-bottom:15px; color:var(--text-dim)">Son Çalışmaların</h4>
                    <div id="history-list"></div>
                </div>

                <!-- FORUM -->
                <div id="tab-forum" class="tab-content">
                    <div class="card" style="padding: 15px;">
                        <textarea id="forum-input" rows="2" placeholder="Neler öğrendin? Sorun mu var?" style="margin-bottom:10px;"></textarea>
                        <div id="img-preview-box" style="display:none; margin-bottom:15px;">
                            <img id="img-preview" style="max-height:180px; border-radius:12px; border:1px solid var(--border)">
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <button class="btn btn-secondary" style="padding: 8px 15px;" onclick="document.getElementById('file-post').click()"><i class="fas fa-image"></i> Görsel</button>
                            <input type="file" id="file-post" hidden accept="image/*" onchange="previewImage(event)">
                            <button class="btn btn-primary" style="padding: 8px 25px;" onclick="createPost()">Paylaş</button>
                        </div>
                    </div>
                    <div id="forum-feed"></div>
                </div>

                <!-- RANKS -->
                <div id="tab-ranks" class="tab-content">
                    <div class="card">
                        <h2 style="text-align:center; margin-bottom:20px;"><i class="fas fa-trophy" style="color:var(--xp)"></i> Global Liderler</h2>
                        <div id="leaderboard"></div>
                    </div>
                </div>

                <!-- PROFILE -->
                <div id="tab-profile" class="tab-content">
                    <div class="card" style="text-align:center;">
                        <div style="position:relative; display:inline-block; margin-bottom:20px;">
                            <img id="prof-avatar" src="" class="avatar" style="width:100px; height:100px; border-width:4px;">
                            <button class="btn btn-primary" style="position:absolute; bottom:0; right:0; padding:8px; border-radius:50%; width:35px; height:35px;" onclick="document.getElementById('file-avatar').click()"><i class="fas fa-camera"></i></button>
                            <input type="file" id="file-avatar" hidden accept="image/*" onchange="updateAvatar(event)">
                        </div>
                        <div style="margin-bottom:20px;">
                            <label style="font-size:0.75rem; color:var(--text-dim); display:block; text-align:left; margin-bottom:5px;">KULLANICI ADI</label>
                            <input type="text" id="prof-username">
                        </div>
                        <button class="btn btn-primary" style="width:100%" onclick="updateProfile()">Değişiklikleri Kaydet</button>
                    </div>
                    <button class="btn btn-danger" style="width:100%" onclick="deleteAccount()"><i class="fas fa-trash"></i> Hesabımı Sil</button>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Config (Hassas Bilgiler)
        const firebaseConfig = {
            apiKey: "AIzaSyBGFyQsqe32hGgskY5yRfrbXlH8MuHKaLE",
            authDomain: "novatech-e7507.firebaseapp.com",
            databaseURL: "https://novatech-e7507-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "novatech-e7507"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let userData = null;
        let tempImage = null;

        const LESSONS = {
            "Matematik": ["Sayılar", "Denklemler", "Fonksiyonlar", "Trigonometri", "Limit", "Türev", "İntegral", "Logaritma", "Olasılık", "Diziler"],
            "Fizik": ["Kuvvet", "Vektörler", "Elektrik", "Manyetizma", "Optik", "Modern Fizik", "Dalgalar", "Basınç", "Sıvıların Kaldırma Kuvveti", "Enerji"],
            "Kimya": ["Atom Teorisi", "Gazlar", "Çözeltiler", "Hız", "Denge", "Asit-Baz", "Elektrokimya", "Organik Giriş", "Alkanlar", "Polimerler"],
            "Biyoloji": ["Hücre", "DNA-RNA", "Protein Sentezi", "Fotosentez", "Bitki Biyolojisi", "Sistemler", "Kalıtım", "Ekoloji", "Canlılar", "Solunum"],
            "Türkçe": ["Sözcük Anlamı", "Cümle Anlamı", "Paragraf", "Yazım Kuralları", "Noktalama", "Sözcük Türleri", "Ögeler", "Anlatım", "Fiilimsiler", "Edebiyat"],
            "Tarih": ["İslam Öncesi", "İlk Türk Devletleri", "Osmanlı Kuruluş", "Osmanlı Yükselme", "Kurtuluş Savaşı", "Cumhuriyet Tarihi", "Atatürk İlkeleri", "Dünya Tarihi", "Soğuk Savaş", "Çağdaş Türk Tarihi"],
            "Coğrafya": ["Dünyanın Şekli", "Harita", "İklim", "Yer Şekilleri", "Beşeri Sistemler", "Bölgeler", "Çevre", "Nüfus", "Ekonomi", "Ulaşım"],
            "İngilizce": ["Present Tense", "Past Tense", "Future Tense", "Relative Clauses", "Conditionals", "Passive Voice", "Modals", "Vocabulary", "Reading", "Phrasal Verbs"],
            "Felsefe": ["Bilgi Felsefesi", "Varlık Felsefesi", "Ahlak Felsefesi", "Siyaset Felsefesi", "Sanat Felsefesi", "Bilim Felsefesi", "Din Felsefesi", "Antik Çağ", "Modern Felsefe", "Mantık"],
            "Geometri": ["Açılar", "Üçgenler", "Dörtgenler", "Çokgenler", "Çember", "Analitik", "Katı Cisimler", "Dönüşümler", "Vektörler", "Benzerlik"]
        };

        const RANKS = ["Acemi", "Çaylak", "Gezgin", "Gözcü", "Araştırmacı", "Bilgin", "Usta", "Dahi", "Efsane", "Yüce", "Mistik", "Nova"];

        // --- AUTH ---
        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                onValue(ref(db, `users/${user.uid}`), snap => {
                    userData = snap.val();
                    if (userData) {
                        renderUI();
                        document.getElementById('app').style.display = 'block';
                        document.getElementById('auth-overlay').style.display = 'none';
                    }
                });
                initApp();
            } else {
                document.getElementById('app').style.display = 'none';
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        function renderUI() {
            let lvl = 1, req = 500, tempXp = userData.xp || 0;
            while(tempXp >= req) { tempXp -= req; lvl++; req = Math.floor(req * 1.5); }
            const perc = (tempXp / req) * 100;
            const rank = RANKS[Math.min(lvl - 1, RANKS.length - 1)];

            document.getElementById('user-display-name').innerText = userData.username;
            document.getElementById('user-rank-name').innerText = `${rank} • LVL ${lvl}`;
            document.getElementById('xp-text-cur').innerText = `${Math.floor(tempXp)} XP`;
            document.getElementById('xp-text-max').innerText = `${req} XP`;
            document.getElementById('xp-inner-bar').style.width = perc + "%";
            
            const av = userData.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser.uid}`;
            document.getElementById('side-avatar').src = av;
            document.getElementById('nav-avatar').src = av;
            document.getElementById('prof-avatar').src = av;
            document.getElementById('prof-username').value = userData.username;
        }

        function initApp() {
            const ls = document.getElementById('study-lesson');
            ls.innerHTML = Object.keys(LESSONS).map(l => `<option value="${l}">${l}</option>`).join('');
            loadTopics();
            syncForum();
            syncLeaderboard();
            syncHistory();
        }

        window.loadTopics = () => {
            const lesson = document.getElementById('study-lesson').value;
            const ts = document.getElementById('study-topic');
            ts.innerHTML = LESSONS[lesson].map(t => `<option value="${t}">${t}</option>`).join('');
        };

        // --- CORE ---
        window.saveStudy = async () => {
            const d = parseInt(document.getElementById('val-d').value) || 0;
            const y = parseInt(document.getElementById('val-y').value) || 0;
            const b = parseInt(document.getElementById('val-b').value) || 0;
            if (d === 0 && y === 0) return toast("Lütfen veri girin!", "error");

            const lesson = document.getElementById('study-lesson').value;
            const topic = document.getElementById('study-topic').value;

            // Rule 1 Compliance: artifacts/{appId}/users/{userId}/...
            await push(ref(db, `studies/${currentUser.uid}`), { lesson, topic, d, y, b, ts: Date.now() });
            
            const xpGain = (d * 5) + 10;
            await update(ref(db, `users/${currentUser.uid}`), { xp: (userData.xp || 0) + xpGain });

            toast(`+${xpGain} XP Kazandın!`);
            ['val-d','val-y','val-b'].forEach(i => document.getElementById(i).value = "");
        };

        window.dailyCheckIn = async () => {
            const today = new Date().toDateString();
            if (userData.lastCheck === today) return toast("Zaten ödülünü aldın!", "error");

            await update(ref(db, `users/${currentUser.uid}`), {
                xp: (userData.xp || 0) + 150,
                lastCheck: today
            });
            toast("+150 XP Günlük Ödül!");
        };

        // --- FORUM ---
        function syncForum() {
            onValue(ref(db, 'forum'), snap => {
                const feed = document.getElementById('forum-feed');
                feed.innerHTML = "";
                const data = snap.val();
                if (!data) return;

                Object.keys(data).reverse().forEach(id => {
                    const p = data[id];
                    const likes = p.likes ? Object.keys(p.likes).length : 0;
                    const liked = p.likes && p.likes[currentUser.uid];

                    feed.innerHTML += `
                        <div class="post">
                            <div class="post-header">
                                <img src="${p.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed='+p.uid}" class="avatar">
                                <div style="flex:1">
                                    <div style="font-weight:800; font-size:0.85rem;">${p.author}</div>
                                    <div style="font-size:0.6rem; color:var(--text-dim)">${new Date(p.ts).toLocaleString()}</div>
                                </div>
                                ${p.uid === currentUser.uid ? `<i class="fas fa-trash" style="color:var(--danger); cursor:pointer" onclick="deletePost('${id}')"></i>` : ''}
                            </div>
                            <div style="font-size:0.9rem;">${p.text}</div>
                            ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
                            <div class="post-actions">
                                <div class="action-item ${liked?'liked':''}" onclick="likePost('${id}')"><i class="${liked?'fas':'far'} fa-heart"></i> ${likes}</div>
                                <div class="action-item"><i class="far fa-comment"></i> Yorum Yap</div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.createPost = async () => {
            const text = document.getElementById('forum-input').value;
            if (!text && !tempImage) return;

            await push(ref(db, 'forum'), {
                uid: currentUser.uid,
                author: userData.username,
                avatar: userData.avatar || "",
                text,
                img: tempImage,
                ts: Date.now()
            });

            document.getElementById('forum-input').value = "";
            tempImage = null;
            document.getElementById('img-preview-box').style.display = 'none';
            toast("Paylaşıldı!");
        };

        window.likePost = async id => {
            const path = `forum/${id}/likes/${currentUser.uid}`;
            const s = await get(ref(db, path));
            if (s.exists()) await remove(ref(db, path));
            else await set(ref(db, path), true);
        };

        window.deletePost = async id => {
            if (confirm("Silmek istiyor musun?")) await remove(ref(db, `forum/${id}`));
        };

        // --- OTHERS ---
        function syncLeaderboard() {
            onValue(ref(db, 'users'), snap => {
                const list = document.getElementById('leaderboard');
                list.innerHTML = "";
                const users = Object.values(snap.val() || {}).sort((a,b) => (b.xp||0) - (a.xp||0));
                users.forEach((u, i) => {
                    list.innerHTML += `
                        <div style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--border); ${u.uid===currentUser.uid?'background:rgba(99,102,241,0.05);':''}">
                            <div style="font-weight:900; color:var(--xp); width:25px;">${i+1}</div>
                            <img src="${u.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed='+u.uid}" style="width:35px; height:35px; border-radius:50%">
                            <div style="flex:1; font-weight:700; font-size:0.85rem;">${u.username}</div>
                            <div style="font-weight:800; color:var(--primary)">${u.xp || 0} XP</div>
                        </div>
                    `;
                });
            });
        }

        function syncHistory() {
            onValue(ref(db, `studies/${currentUser.uid}`), snap => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                const data = snap.val();
                if (!data) return;

                Object.values(data).reverse().slice(0, 10).forEach(h => {
                    list.innerHTML += `
                        <div class="card" style="padding:15px; margin-bottom:10px;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                <span style="font-weight:800; font-size:0.8rem;">${h.lesson}</span>
                                <span style="color:var(--accent); font-weight:900; font-size:0.8rem;">${h.d}D / ${h.y}Y</span>
                            </div>
                            <div style="font-size:0.65rem; color:var(--text-dim)">${h.topic} • ${new Date(h.ts).toLocaleDateString()}</div>
                        </div>
                    `;
                });
            });
        }

        // --- UTILS ---
        window.previewImage = e => {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = ev => {
                tempImage = ev.target.result;
                document.getElementById('img-preview-box').style.display = 'block';
                document.getElementById('img-preview').src = tempImage;
            };
            r.readAsDataURL(f);
        };

        window.updateAvatar = e => {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = async ev => {
                await update(ref(db, `users/${currentUser.uid}`), { avatar: ev.target.result });
                toast("Profil resmi güncellendi.");
            };
            r.readAsDataURL(f);
        };

        window.updateProfile = async () => {
            const nick = document.getElementById('prof-username').value;
            if (nick.length < 3) return toast("Çok kısa!", "error");
            await update(ref(db, `users/${currentUser.uid}`), { username: nick });
            toast("Profil güncellendi.");
        };

        window.deleteAccount = async () => {
            if (confirm("Hesabını silmek istediğine emin misin? TÜM VERİLERİN SİLİNECEK!")) {
                const uid = currentUser.uid;
                await remove(ref(db, `users/${uid}`));
                await remove(ref(db, `studies/${uid}`));
                await deleteUser(currentUser).catch(() => toast("Güvenlik için tekrar giriş yapın.", "error"));
            }
        };

        window.toast = (msg, type = "success") => {
            const c = document.getElementById('notification-container');
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.borderLeft = `4px solid ${type==='error'?'var(--danger)':'var(--accent)'}`;
            t.innerHTML = `<span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        };

        window.switchTab = (id, btn) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            btn.classList.add('active');
        };

        window.toggleAuth = (isLogin) => {
            document.getElementById('login-box').style.display = isLogin ? 'block' : 'none';
            document.getElementById('register-box').style.display = isLogin ? 'none' : 'block';
        };

        window.handleAuth = async (type) => {
            try {
                if (type === 'login') {
                    const e = document.getElementById('auth-email').value;
                    const p = document.getElementById('auth-pass').value;
                    await signInWithEmailAndPassword(auth, e, p);
                } else {
                    const u = document.getElementById('reg-name').value;
                    const e = document.getElementById('reg-email').value;
                    const p = document.getElementById('reg-pass').value;
                    if (u.length < 2) throw new Error("İsim çok kısa.");
                    const res = await createUserWithEmailAndPassword(auth, e, p);
                    await set(ref(db, `users/${res.user.uid}`), {
                        uid: res.user.uid,
                        username: u,
                        xp: 0,
                        avatar: ""
                    });
                }
            } catch (e) { toast(e.message, "error"); }
        };

        window.logout = () => signOut(auth);

    </script>
</body>
</html>
