<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaTech Ultra | Eğitim ve Sosyal Platform</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg: #030508;
            --card: #0c0f16;
            --border: #1e2532;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #10b981;
            --danger: #ef4444;
            --text: #f9fafb;
            --text-dim: #94a3b8;
            --xp: #fbce44;
            --nav-h: 70px;
            --sidebar-w: 280px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- Notifications --- */
        #notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }

        /* --- Layout --- */
        .app-container { display: flex; min-height: 100vh; }
        
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-h);
            background: rgba(12, 15, 22, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 900;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: var(--nav-h);
            bottom: 0;
            z-index: 800;
            transition: transform 0.3s ease;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-w);
            margin-top: var(--nav-h);
            padding: 30px;
            max-width: 1200px;
        }

        /* --- Components --- */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border); }

        input, select, textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            margin-bottom: 15px;
            outline: none;
        }

        .xp-bar { height: 8px; background: #1e293b; border-radius: 10px; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); width: 0%; transition: 1s ease-out; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: 14px;
            margin-bottom: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-link.active { background: var(--primary); color: white; }

        .post { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); background: #111; }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); z-index: 1001; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .menu-toggle { display: block !important; }
        }

        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <!-- Auth Panel -->
    <div id="auth-overlay">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 2rem; letter-spacing: -1px;">NOVA<span style="color:var(--primary)">TECH</span></h1>
                <p style="color:var(--text-dim); font-size: 0.85rem;">Eğitimin Geleceğine Hoş Geldin</p>
            </div>
            
            <div id="login-box">
                <input type="email" id="auth-email" placeholder="E-posta">
                <input type="password" id="auth-pass" placeholder="Şifre">
                <button class="btn btn-primary" style="width:100%" id="btn-login">Giriş Yap</button>
                <p style="margin-top:20px; text-align:center; font-size:0.8rem; color:var(--text-dim)">Hesabın yok mu? <span style="color:var(--primary); cursor:pointer" onclick="toggleAuth(false)">Kayıt Ol</span></p>
            </div>

            <div id="register-box" style="display:none">
                <input type="text" id="reg-name" placeholder="Kullanıcı Adı">
                <input type="email" id="reg-email" placeholder="E-posta">
                <input type="password" id="reg-pass" placeholder="Şifre">
                <button class="btn btn-primary" style="width:100%" id="btn-register">Hesap Oluştur</button>
                <p style="margin-top:20px; text-align:center; font-size:0.8rem; color:var(--text-dim)">Üye misin? <span style="color:var(--primary); cursor:pointer" onclick="toggleAuth(true)">Giriş Yap</span></p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display:none">
        <header>
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="menu-toggle" onclick="toggleSidebar(true)"><i class="fas fa-bars"></i></button>
                <div style="font-weight: 800; font-size: 1.1rem;">NOVATECH <span style="color:var(--primary)">V4</span></div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <button class="btn btn-secondary" onclick="dailyCheckIn()"><i class="fas fa-calendar-check" style="color:var(--xp)"></i> Yoklama</button>
                <img id="nav-avatar" src="" class="avatar" style="width:35px; height:35px;">
            </div>
        </header>

        <div class="app-container">
            <aside class="sidebar" id="sidebar">
                <div class="user-info card" style="background: rgba(255,255,255,0.02); padding: 15px; border-style: dashed;">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img id="side-avatar" src="" class="avatar">
                        <div style="overflow:hidden">
                            <div id="user-display-name" style="font-weight:800; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Yükleniyor...</div>
                            <div id="user-rank-name" style="color:var(--xp); font-size:0.65rem; font-weight:900; text-transform:uppercase;">ACEMİ</div>
                        </div>
                    </div>
                    <div class="xp-bar" style="margin-top:10px;"><div id="xp-inner-bar" class="xp-fill"></div></div>
                </div>

                <nav style="flex:1">
                    <div class="nav-link active" onclick="switchTab('study', this)"><i class="fas fa-book-open"></i> <span>Çalışma Paneli</span></div>
                    <div class="nav-link" onclick="switchTab('forum', this)"><i class="fas fa-globe"></i> <span>Topluluk</span></div>
                    <div class="nav-link" onclick="switchTab('ranks', this)"><i class="fas fa-crown"></i> <span>Sıralama</span></div>
                    <div class="nav-link" onclick="switchTab('profile', this)"><i class="fas fa-user"></i> <span>Profil</span></div>
                </nav>

                <div class="nav-link" onclick="logout()" style="color:var(--danger); border: 1px solid rgba(239,68,68,0.1)">
                    <i class="fas fa-sign-out-alt"></i> <span>Çıkış Yap</span>
                </div>
            </aside>

            <main class="main-content">
                <div id="tab-study" class="tab-content active">
                    <div class="card">
                        <h3><i class="fas fa-plus-circle"></i> Yeni Kayıt</h3>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:15px;">
                            <select id="study-lesson" onchange="loadTopics()"></select>
                            <select id="study-topic"></select>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:10px;">
                            <input type="number" id="val-d" placeholder="D">
                            <input type="number" id="val-y" placeholder="Y">
                            <input type="number" id="val-b" placeholder="B">
                        </div>
                        <button class="btn btn-primary" style="width:100%" onclick="saveStudy()">Kaydet</button>
                    </div>
                    <div id="history-list"></div>
                </div>

                <div id="tab-forum" class="tab-content">
                    <div class="card">
                        <textarea id="forum-input" rows="2" placeholder="Paylaşmak istediğin bir şey mi var?"></textarea>
                        <button class="btn btn-primary" style="width:100%" onclick="createPost()">Paylaş</button>
                    </div>
                    <div id="forum-feed"></div>
                </div>

                <div id="tab-ranks" class="tab-content">
                    <div class="card">
                        <h2 style="text-align:center; margin-bottom:20px;">Liderler</h2>
                        <div id="leaderboard"></div>
                    </div>
                </div>

                <div id="tab-profile" class="tab-content">
                    <div class="card" style="text-align:center;">
                        <img id="prof-avatar" src="" class="avatar" style="width:100px; height:100px; margin-bottom:15px;">
                        <input type="text" id="prof-username" placeholder="Kullanıcı Adı">
                        <button class="btn btn-primary" style="width:100%" onclick="updateProfile()">Güncelle</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGFyQsqe32hGgskY5yRfrbXlH8MuHKaLE",
            authDomain: "novatech-e7507.firebaseapp.com",
            databaseURL: "https://novatech-e7507-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "novatech-e7507"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const appId = "novatech_v4_ultra";

        let currentUser = null;
        let userData = null;

        const LESSONS = {
            "Matematik": ["Sayılar", "Denklemler", "Türev", "İntegral"],
            "Fizik": ["Kuvvet", "Optik", "Elektrik"],
            "Kimya": ["Atom", "Gazlar", "Denge"],
            "Biyoloji": ["Hücre", "Sistemler"]
        };

        // --- AUTH LOGIC ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Force UI switch
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                
                // Fetch Profile
                const profileRef = ref(db, `artifacts/${appId}/users/${user.uid}/profile`);
                onValue(profileRef, (snap) => {
                    userData = snap.val();
                    if (!userData) {
                        createInitialProfile(user);
                    } else {
                        renderUI();
                        initAppOnce();
                    }
                });
            } else {
                currentUser = null;
                document.getElementById('auth-overlay').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });

        async function createInitialProfile(user) {
            const data = {
                uid: user.uid,
                username: user.email.split('@')[0],
                xp: 0,
                ts: Date.now()
            };
            await set(ref(db, `artifacts/${appId}/users/${user.uid}/profile`), data);
        }

        document.getElementById('btn-login').onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                toast("Giriş başarılı, yönlendiriliyorsun...");
            } catch (e) { toast("Hata: " + e.message, "error"); }
        };

        document.getElementById('btn-register').onclick = async () => {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value;
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, `artifacts/${appId}/users/${cred.user.uid}/profile`), {
                    uid: cred.user.uid,
                    username: name || email.split('@')[0],
                    xp: 0
                });
                toast("Hesap açıldı!");
            } catch (e) { toast("Hata: " + e.message, "error"); }
        };

        window.logout = () => signOut(auth);

        // --- APP LOGIC ---
        function renderUI() {
            if (!userData) return;
            document.getElementById('user-display-name').innerText = userData.username;
            const av = `https://api.dicebear.com/7.x/bottts/svg?seed=${userData.uid}`;
            document.getElementById('side-avatar').src = av;
            document.getElementById('nav-avatar').src = av;
            document.getElementById('prof-avatar').src = av;
            
            // Simple XP Rank
            const lvl = Math.floor(userData.xp / 500) + 1;
            document.getElementById('user-rank-name').innerText = `SEVİYE ${lvl}`;
            document.getElementById('xp-inner-bar').style.width = `${(userData.xp % 500) / 5}%`;
        }

        let initialized = false;
        function initAppOnce() {
            if (initialized) return;
            initialized = true;
            const ls = document.getElementById('study-lesson');
            ls.innerHTML = Object.keys(LESSONS).map(l => `<option value="${l}">${l}</option>`).join('');
            loadTopics();
            syncForum();
            syncLeaderboard();
        }

        window.loadTopics = () => {
            const lesson = document.getElementById('study-lesson').value;
            document.getElementById('study-topic').innerHTML = LESSONS[lesson].map(t => `<option value="${t}">${t}</option>`).join('');
        };

        window.saveStudy = async () => {
            const d = parseInt(document.getElementById('val-d').value) || 0;
            const gain = d * 10 + 5;
            await update(ref(db, `artifacts/${appId}/users/${currentUser.uid}/profile`), { xp: (userData.xp || 0) + gain });
            toast(`+${gain} XP Kazanıldı!`);
        };

        function syncForum() {
            onValue(ref(db, `artifacts/${appId}/public/data/forum`), snap => {
                const feed = document.getElementById('forum-feed');
                feed.innerHTML = "";
                const data = snap.val();
                if (!data) return;
                Object.values(data).reverse().forEach(p => {
                    feed.innerHTML += `<div class="post"><b>${p.author}:</b> ${p.text}</div>`;
                });
            });
        }

        window.createPost = async () => {
            const text = document.getElementById('forum-input').value;
            if(!text) return;
            await push(ref(db, `artifacts/${appId}/public/data/forum`), {
                author: userData.username,
                text,
                ts: Date.now()
            });
            document.getElementById('forum-input').value = "";
        };

        function syncLeaderboard() {
            onValue(ref(db, `artifacts/${appId}/public/data/leaderboard`), snap => {
                const div = document.getElementById('leaderboard');
                div.innerHTML = "";
                const data = snap.val();
                if(!data) return;
                Object.values(data).sort((a,b)=>b.xp-a.xp).forEach(u => {
                    div.innerHTML += `<div style="padding:10px; border-bottom:1px solid #1e2532">${u.username} - ${u.xp} XP</div>`;
                });
            });
            // Update self in leaderboard
            if(currentUser && userData) {
                set(ref(db, `artifacts/${appId}/public/data/leaderboard/${currentUser.uid}`), {
                    username: userData.username,
                    xp: userData.xp
                });
            }
        }

        window.switchTab = (id, btn) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            btn.classList.add('active');
            toggleSidebar(false);
        };

        window.toggleSidebar = (s) => {
            document.getElementById('sidebar').classList.toggle('open', s);
        };

        window.toggleAuth = (login) => {
            document.getElementById('login-box').style.display = login ? 'block' : 'none';
            document.getElementById('register-box').style.display = login ? 'none' : 'block';
        };

        window.toast = (msg, type="success") => {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = msg;
            t.style.borderLeft = `4px solid ${type==='error'?'red':'green'}`;
            document.getElementById('notification-container').appendChild(t);
            setTimeout(()=>t.remove(), 3000);
        };

    </script>
</body>
</html>
