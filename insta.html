<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone UI</title>
    <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fafafa; color: #262626; }

        /* Navigation */
        nav { background: white; border-bottom: 1px solid #dbdbdb; height: 60px; position: fixed; width: 100%; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .nav-container { width: 100%; max-width: 975px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: bold; font-style: italic; cursor: pointer; }
        .search-bar { background: #efefef; border-radius: 8px; padding: 7px 16px; border: none; width: 250px; }
        .nav-icons i { font-size: 22px; margin-left: 22px; cursor: pointer; }

        /* Main Content */
        main { margin-top: 90px; display: flex; justify-content: center; gap: 30px; }
        .feed { width: 100%; max-width: 470px; }

        /* Stories */
        .stories { background: white; border: 1px solid #dbdbdb; border-radius: 8px; padding: 16px; display: flex; gap: 15px; overflow-x: auto; margin-bottom: 24px; }
        .story { display: flex; flex-direction: column; align-items: center; min-width: 66px; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; padding: 2px; border: 2px solid #e1306c; cursor: pointer; }
        .story span { font-size: 12px; margin-top: 5px; width: 100%; overflow: hidden; text-overflow: ellipsis; text-align: center; }

        /* Post Card */
        .post { background: white; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 24px; }
        .post-header { display: flex; align-items: center; padding: 12px; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #ccc; }
        .post-img { width: 100%; min-height: 400px; background: #efefef; display: flex; align-items: center; justify-content: center; }
        .post-actions { padding: 12px; display: flex; gap: 16px; font-size: 24px; }
        .post-actions i:last-child { margin-left: auto; }
        .post-likes { padding: 0 12px; font-weight: 600; font-size: 14px; }
        .post-caption { padding: 8px 12px; font-size: 14px; }
        .post-caption span { font-weight: 600; margin-right: 5px; }

        /* Sidebar */
        .sidebar { width: 320px; display: none; }
        @media (min-width: 1000px) { .sidebar { display: block; } }
        .sidebar-user { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .suggestion-header { display: flex; justify-content: space-between; font-weight: 600; color: #8e8e8e; font-size: 14px; margin-bottom: 15px; }

        .liked { color: #ed4956; animation: heartBeat 0.3s linear; }
        @keyframes heartBeat { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">Instagram</div>
            <input type="text" class="search-bar" placeholder="Ara">
            <div class="nav-icons">
                <i class="fa-solid fa-house"></i>
                <i class="fa-regular fa-paper-plane"></i>
                <i class="fa-regular fa-square-plus"></i>
                <i class="fa-regular fa-compass"></i>
                <i class="fa-regular fa-heart"></i>
            </div>
        </div>
    </nav>

    <main>
        <div class="feed">
            <div class="stories" id="story-container">
                </div>

            <div id="post-container">
                </div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-user">
                <div class="user-avatar" style="width: 56px; height: 56px;"></div>
                <div>
                    <div style="font-weight: 600;">kullanici_adi</div>
                    <div style="color: #8e8e8e;">Kullanıcı İsmi</div>
                </div>
                <a href="#" style="margin-left: auto; color: #0095f6; font-size: 12px; font-weight: 600; text-decoration: none;">Geçiş Yap</a>
            </div>
            <div class="suggestion-header">
                <span>Senin İçin Öneriler</span>
                <span style="color: #262626; cursor: pointer;">Tümünü Gör</span>
            </div>
            <div id="suggestions"></div>
        </aside>
    </main>

    <script>
        // Story Verileri
        const stories = ['ahmet', 'mehmet', 'ayse', 'elifece', 'editimsiuu', 'trend', 'haber'];
        const storyContainer = document.getElementById('story-container');
        
        stories.forEach(user => {
            storyContainer.innerHTML += `
                <div class="story">
                    <img src="https://i.pravatar.cc/150?u=${user}" class="story-img">
                    <span>${user}</span>
                </div>
            `;
        });

        // Post Verileri
        const posts = [
            { user: 'editimsiuu', likes: '1.250', caption: 'Yeni edit yayında! 🚀' },
            { user: 'gezi_rehberi', likes: '850', caption: 'Bugün harika bir yer keşfettik.' }
        ];

        const postContainer = document.getElementById('post-container');
        posts.forEach((post, index) => {
            postContainer.innerHTML += `
                <div class="post">
                    <div class="post-header">
                        <div class="user-info">
                            <img src="https://i.pravatar.cc/150?u=${post.user}" class="user-avatar">
                            ${post.user}
                        </div>
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                    <div class="post-img">
                        <img src="https://picsum.photos/600/600?random=${index}" style="width:100%">
                    </div>
                    <div class="post-actions">
                        <i class="fa-regular fa-heart" onclick="likePost(this)"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-regular fa-paper-plane"></i>
                        <i class="fa-regular fa-bookmark"></i>
                    </div>
                    <div class="post-likes">${post.likes} beğenme</div>
                    <div class="post-caption">
                        <span>${post.user}</span> ${post.caption}
                    </div>
                </div>
            `;
        });

        // Like Fonksiyonu
        function likePost(btn) {
            btn.classList.toggle('fa-regular');
            btn.classList.toggle('fa-solid');
            btn.classList.toggle('liked');
        }
    </script>
</body>
</html>
